services:
  lingo:
    build: .
    image: lingo:local
    ports:
      - "${PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7860
      TRANSPORT: ${TRANSPORT:-whatsapp}
    restart: unless-stopped
    volumes:
      # Persist self-signed certs when TRANSPORT=web
      - ./.lingo-certs:/app/.lingo-certs
